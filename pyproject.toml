[project]
name = "sharepoint_utils"
version = "1.4.0"
description = "Utilidades para SharePoint con Playwright"
readme = "README.md"
authors = [
    { name = "Sebastián Fuentes", email = "sebastianfuentesab@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright==1.62.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<1.0"]
build-backend = "uv_build"
