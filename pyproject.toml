[project]
name = "sharepoint_utils"
version = "1.5.0"
description = "Utilidades para SharePoint con Playwright"
readme = "README.md"
authors = [
    { name = "Sebastián Fuentes", email = "sebastianfuentesab@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright==1.62.0",
    "log_utils",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<1.0"]
build-backend = "uv_build"

[tool.uv.sources]
log_utils = { git = "https://github.com/SebaxFentex/log_utils", tag = "v0.1.0" }
